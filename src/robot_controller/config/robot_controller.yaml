robot_controller:
  ros__parameters:
    simulation_mode: true
    serial_port: "/dev/ttyTHS1"
    baud_rate: 1000000
    control_frequency: 10.0
    default_distance_mm: 150.0
    scan_amplitude_mm: 40.0
    scan_speed_mms: 5.0
    collector_origin_x_mm: 0.0
    collector_origin_y_mm: 250.0
    collector_origin_z_mm: 150.0
    collector_width_mm: 60.0
    enable_trajectory_smoothing: true
    enable_singularity_avoidance: true
